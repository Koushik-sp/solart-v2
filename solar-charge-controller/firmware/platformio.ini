; SolarCharge Controller — bench/simulator firmware (NOT production).
;
; Targets a generic ESP32 dev board (the most common Wi-Fi capable
; Arduino-compatible MCU). Uses the Arduino framework for simplicity.
;
; To build:
;   1. Install VSCode + the PlatformIO IDE extension.
;   2. Open the `firmware/` folder in VSCode.
;   3. Edit src/config.h with your Wi-Fi credentials and the LAN IP of
;      the machine running the backend.
;   4. Plug in the ESP32 and click "Upload" in the PlatformIO toolbar.
;   5. Click "Monitor" to see the serial output.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=0
